spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trivia
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope:
              - email
              - profile

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
